# LIBERO-Comprehensive — Language Variant Suite (Experiment K → L)
# =============================================================================
# 20 missions × 4 language levels (L0 / L1 / L2 / L3) = 80 language strings.
# Reuses existing SingPref demos — **zero new demo generation**.
# Mission ids must remain a strict subset of `single-pref` in task_suites.yaml.
#
# Level definitions (from experiments/experiment.md, Phase 2d node K):
#   L0  no pref          — plain task language; baseline / pretraining-prior check
#   L1  explicit pref    — canonical pref string (verbatim from mission_info.yaml)
#   L2  idiomatic pref   — natural-language idiom that maps directly to the pref
#                          (e.g. "be gentle" → slow ; "stay low" → low path)
#   L3  commonsense pref — context fact that requires reasoning to map to pref
#                          (e.g. "I just had wrist surgery" → slow / careful)
#
# Selection criteria (paraphrase-friendly):
#   - clear action verb + object + location in the task
#   - pref type admits at least one natural idiom (L2) and one commonsense fact (L3)
#   - balance across Series 1 (motion) / Series 2 (skill) / Series 3 (profile)
#
# Coverage: 7 motion + 7 skill + 6 profile pref types.
#
# Consumed by:
#   PolicyEval/eval.py runfiles for the L experiment (0-shot Q7).
#   At rollout time the runfile picks (mission_id, level) → language_text and
#   feeds it as the prompt; eval.py uses the same BDDL/init-state as SingPref.
#
# Generated 2026-04-26 (Zhixu).
# =============================================================================

description: >
  LIBERO-Comprehensive: 20 missions × 4 language paraphrase levels (L0-L3).
  Tests language-grounding robustness of VLAs at varying degrees of indirection
  between the user instruction and the underlying preference.

levels:
  L0:
    name: no_pref
    desc: Plain task instruction with no preference clause. Baseline.
  L1:
    name: explicit
    desc: Canonical pref clause appended to the task (= current SingPref language).
  L2:
    name: idiomatic
    desc: Idiomatic phrase that maps to the pref via convention (no reasoning).
  L3:
    name: commonsense
    desc: Context fact requiring commonsense reasoning to recover the pref.

