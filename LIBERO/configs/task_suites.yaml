multi-pref:
  description: "Series 4 (planned). Multiple preferences per mission."
  missions: []

pref-learn-eff:
  description: "Multi-scale demo subsets for learning efficiency (training-required)."
  missions: []

liberoscale_b0:
  description: >
    Series 5 / Scale Suite — B0 cell only (no-preference baseline).
    Single mission 0-1_032: pick blue_ketchup → basket. NO pref.
    Used as anchor for "task following without pref" in scaling curve.
  missions:
    - 0-1_032

liberoscale:
  description: >
    LIBERO-Scale (Series 5, RQ3 layout-OOD).
    5 slots × 7 layouts (base + _1.._6) for K=7 cell.
    Each slot: task + pref FROZEN, only layout varies.
    Slots: 0-1 (no-pref baseline), 1-1 (motion: Speed up), 2-5 (skill: Pick from left side),
           3-2 (profile: Prefer red), 4-3 (multi: left + speed).
  missions:
    # ── Slot 0-1 (7): no-pref baseline, blue_ketchup in basket ──
    - 0-1_032
    - 0-1_032_1
    - 0-1_032_2
    - 0-1_032_3
    - 0-1_032_4
    - 0-1_032_5
    - 0-1_032_6
    # ── Slot 1-1 (10): motion pref Speed up, soup+cheese in basket ──
    - 1-1_004        # example
    - 1-1_004_1      # train: light, swap distractors
    - 1-1_004_2      # train: light+, add clutter (7 obj)
    - 1-1_004_3      # train: medium, big rearrange (7 obj)
    - 1-1_004_4      # train: heavy, kitchen scene
    - 1-1_004_5      # train: heavy, study scene
    - 1-1_004_6      # train: visual, +wooden_cabinet corner
    - 1-1_004_7      # held-out: main_table problem class
    - 1-1_004_8      # held-out: kitchen v2
    - 1-1_004_9      # held-out: living_room minimalist
    # ── Slot 2-5 (10): skill pref Pick from left side, ketchup in basket ──
    - 2-5_116        # example
    - 2-5_116_1      # train: light, swap distractors (Floor)
    - 2-5_116_2      # train: light v2, different distractor set (Floor)
    - 2-5_116_3      # train: clutter 6-obj (Floor)
    - 2-5_116_4      # train: minimalist 2-distractor (Floor)
    - 2-5_116_5      # train: heavy, Kitchen Tabletop
    - 2-5_116_6      # train: Kitchen with different distractor types
    - 2-5_116_7      # held-out: main_table problem class
    - 2-5_116_8      # held-out: kitchen v2
    - 2-5_116_9      # held-out: floor minimalist (3 obj)
    # ── Slot 3-2 (10): profile pref Prefer red, pick book on shelf ──
    - 3-2_097_1      # example
    - 3-2_097_2      # train: light, swap book positions (Study)
    - 3-2_097_3      # train: heavy, Living_Room scene change
    - 3-2_097_4      # train: light+, 5 book candidates (Study)
    - 3-2_097_5      # train: medium, books + cream_cheese/butter (Study)
    - 3-2_097_6      # train: medium, books + alphabet_soup/orange_juice (Study)
    - 3-2_097_7      # train: visual+, +red_basket multi-red distractor (Study)
    - 3-2_097_8      # held-out: main_table problem class
    - 3-2_097_9      # held-out: minimalist 2-book (Study)
    - 3-2_097_10     # held-out: kitchen scene
    # ── Slot 4-3 (7): multi-pref left+speed, ketchup/bbq → basket/red_basket ──
    - 4-3_116
    - 4-3_116_1
    - 4-3_116_2
    - 4-3_116_3
    - 4-3_116_4
    - 4-3_116_5
    - 4-3_116_6

liberoscale_layout_ood:
  description: >
    LIBERO-Scale Layout-OOD eval (held-out from liberoscale).
    4 pref slot × 3 unseen layouts = 12 missions. task + pref FROZEN per slot,
    only layout (fixture / distractor set / target pose) varies vs training.
    Eval-only — no demo HDF5. conditions=[pref] only (sweep RQ3 decision).
  missions:
    # ── Slot 1-1 (motion: Speed up) ──
    - 1-1_004_7
    - 1-1_004_8
    - 1-1_004_9
    # ── Slot 2-5 (skill: Pick from left side) ──
    - 2-5_116_7
    - 2-5_116_8
    - 2-5_116_9
    # ── Slot 3-2 (profile: Prefer red) ──
    - 3-2_097_8
    - 3-2_097_9
    - 3-2_097_10
    # ── Slot 4-3 (multi: left + speed) ──
    - 4-3_116_7
    - 4-3_116_8
    - 4-3_116_9

liberoscale_pref_ood:
  description: >
    LIBERO-Scale Pref-OOD eval (different-task generalization).
    3 unseen layouts of nopref-baseline task (0-1_032 family).
    task ≠ training-pref tasks; layout unseen; eval sweeps each of the 4
    trained prefs (1-1/2-5/3-2/4-3) onto these 3 layouts → 4 × 3 = 12 cells.
    Eval-only — no demo HDF5. mission_info ships nopref; pref injected at runfile.
  missions:
    - 0-1_032_7
    - 0-1_032_8
    - 0-1_032_9

pref-compose:
  description: >
    LIBERO-Compose (Series 4, RQ4 a/b). 4 layouts × 4 conditions
    (nopref / A / B / A+B) = 16 missions. C1 Decompose: train (nopref+A+A+B) eval B.
    C2 Compose: train (nopref+A+B) eval A+B. See series_4/COMPOSE_EXPERIMENT.md.
  missions:
    # ── 4-3 / 116 (Pick from left side + Speed up) ──
    - 4-3_116_combo_nopref
    - 4-3_116_combo_A   # Pick from left side
    - 4-3_116_combo_B   # Speed up
    - 4-3_116_combo_AB  # left + speed
    # ── 4-4 / 001 (Rotate when placing + Prefer red) ──
    - 4-4_001_combo_nopref
    - 4-4_001_combo_A   # Rotate when placing
    - 4-4_001_combo_B   # Prefer red
    - 4-4_001_combo_AB
    # ── 4-5 / 118m (Pick from top + Prefer dairy, milk-renamed BDDL) ──
    - 4-5_118m_combo_nopref
    - 4-5_118m_combo_A  # Pick from top
    - 4-5_118m_combo_B  # Prefer dairy
    - 4-5_118m_combo_AB
    # ── 4-6 / 068 (Lay object down + Serve double portion) ──
    - 4-6_068_combo_nopref
    - 4-6_068_combo_A   # Lay object down
    - 4-6_068_combo_B   # Serve double portion (BDDL needs 2nd ketchup, TODO)
    - 4-6_068_combo_AB

prefconflict:
  description: >
    LIBERO-PrefConflict (Suite 4, RQ5).
    5 pp opposing-pref pairs × 2 = 10 missions + 3 pt task-pref conflict cells (_c
    new task lan) = 13 test missions. R₁/R₂ training adds 5 + 3 aux missions
    (not listed here; see series_6/task_suite.yaml `training_aux`).
    See LIBERO/dataset/series_6/task_suite.yaml + conflict_pair_reference.md.
  missions:
    # ── pp pair 1 speed (M-M) ──
    - 1-1_004      # Speed up
    - 1-2_113      # Slow down
    # ── pp pair 2 height (M-M) ──
    - 1-7_104      # Move higher
    - 1-5_114      # Close to ground when moving
    # ── pp pair 4 pick LR (S-S) ──
    - 2-13_001     # Pick from left edge
    - 2-1_077      # Pick from right edge
    # ── pp pair 5 push/drag (S-S) — OOD pool ──
    - 2-8_ood3     # Push instead of pick-and-put
    - 2-9_ood3     # Drag instead of pick-and-put
    # ── pp pair 7 size (U-U) ──
    - 3-5_120_1    # Prefer bigger objects
    - 3-15_106_1   # Prefer smaller objects
    # ── pt cells (3) — new conflict task-lan variants (_c suffix) ──
    - 3-1_006_1c   # pt1 color  (pref green  / task asks red)
    - 3-9_118_1c   # pt3 category (pref dairy / task asks canned)
    - 3-8_007_1c   # pt5 quantity (pref double / task asks single)

