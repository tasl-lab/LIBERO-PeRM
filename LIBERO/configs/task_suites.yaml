
# Task suite → mission_id registry.
# Source of truth for which missions belong to which benchmark suite.
# Consumed by:
#   - ZeroShotEval/rollout.py, batch_rollout.py
#   - batch_eval/run_eval.py (VLM compliance)
#   - aggregate.py
#
