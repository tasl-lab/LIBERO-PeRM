    pref_type: max_acc
    task: Put the cream cheese in the bowl.
    pref_canonical: Avoid sudden acceleration.
    S1: Smoothly transfer the cream cheese into the bowl, easing in and out without any abrupt jolts.
    S2: Put the cream cheese in the bowl. The bowl is balanced on a stack of plates that will topple if knocked.

