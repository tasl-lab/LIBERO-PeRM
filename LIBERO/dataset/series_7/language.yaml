    task: Pick up the chocolate pudding and place it in the basket.
    pref_canonical: Close to ground when moving.
    S1: Pick up the chocolate pudding and slide it into the basket while keeping the arm low to the surface throughout.
    S2: Pick up the chocolate pudding and place it in the basket. There is a low-hanging cabinet directly above the workspace.

  - mission_id: 1-6_105
