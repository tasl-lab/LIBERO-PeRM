# Series 7 — LIBERO-Comprehensive language inputs
# =============================================================================
# 34 missions × 2 paraphrase settings = 68 prompts.
#
# Settings:
#   S1 fused      — task and pref combined into a single fluent instruction.
#                   No reasoning required to recover the canonical pref.
#   S2 reasoning  — task stated, plus a context fact / scenario from which the
#                   canonical pref must be inferred via one commonsense hop.
#                   The fact never names the pref or its synonyms.
#
# Authoring rules: dataset/series_7/reference.md (Rule 1 = S1, Rule 2 = S2).
# Mission set:    dataset/series_7/task_suite.yaml.
#
# Schema per entry:
#   mission_id, family, pref_type, task (reference, not used as prompt),
#   pref_canonical (= L1 reference, also not used as prompt), S1, S2.
#
# At rollout time the runfile picks (mission_id, setting) → S1|S2 string and
# feeds it as the prompt; eval.py uses the same BDDL/init-state as SingPref.
#
# 2026-04-29 (Zhixu).
# =============================================================================

description: >
  Series 7 paraphrasing prompts. Per (mission, setting) one English string;
  S1 fused vs S2 commonsense-reasoning.

settings:
  S1:
    name: fused
    desc: Task and pref fused into one fluent instruction; no inference needed.
  S2:
    name: reasoning
    desc: Task plus a context fact requiring one commonsense hop to recover the pref.

missions:

  # ── Series 1 — Motion preference (8) ────────────────────────────────────────

  - mission_id: 1-1_004
    family: 1-1
    pref_type: speed_range
    task: Put both the alphabet soup and the cream cheese box in the basket.
    pref_canonical: Speed up.
    S1: Quickly load both the alphabet soup and the cream cheese box into the basket.
    S2: Put both the alphabet soup and the cream cheese box in the basket. Guests are pulling into the driveway right now.

  - mission_id: 1-2_113
    family: 1-2
    pref_type: speed_range
    task: Pick up the butter and place it in the basket.
    pref_canonical: Slow down.
    S1: Carefully and slowly transfer the butter into the basket.
    S2: Pick up the butter and place it in the basket. The butter has been sitting out and is starting to soften and smear.

  - mission_id: 1-3_107
