# Series 7 — LIBERO-Comprehensive (Suite 5, Q7 / RQ1-paraphrase axis)
# =============================================================================
# 34 missions × 2 paraphrase settings (S1 fused / S2 reasoning) = 68 lang strings.
#
# Mission selection rule (2026-04-29):
#   For each pref family X-Y in single-pref v2 (34 families covering Series 1/2/3),
#   pick the mission with the highest 0-shot **pref-condition** SR averaged
#   across pi05_pref + pi0_pref. Tie-break: composite avg over all 4 0-shot
#   columns, then mission_id alphabetically.
#   Source: Policy_output/0shot/single-pref/0shot_official_summary.xlsx.
#   Rationale: Q7 measures whether paraphrasing degrades pref-following on
#   missions where the canonical pref *can* already be followed; weak-baseline
#   missions add noise.
#
# NO new demos / BDDLs / init states live under series_7/ — all physical
# assets reused verbatim from series_1 / series_2 / series_3 via mission_id.
#
# Per-mission language strings:  LIBERO/dataset/series_7/language.yaml
# Paraphrasing rules (S1 / S2):  LIBERO/dataset/series_7/reference.md
# Suite registry entry:          LIBERO/configs/task_suites.yaml (`comprehensive`)
#
# INVARIANT: every mission_id below MUST be in the `single-pref` suite of
# task_suites.yaml (strict subset).
# =============================================================================

suite: comprehensive
series: 7
description: >
  LIBERO-Comprehensive — language paraphrase axis. 34 missions (one
  best-0-shot mission per pref family) reused from series 1/2/3. Each
  mission is rendered under 2 settings: S1 fused (task + pref combined
  in one fluent sentence; no reasoning required) and S2 reasoning (task
  stated, plus a context fact requiring commonsense inference to recover
  the canonical pref). No new physical data; series_7/ is language-only.

