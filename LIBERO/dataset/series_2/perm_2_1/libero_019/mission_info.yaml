workspace: kitchen_scene1
language_instructions: Put the black bowl on the plate
optimized_instruction: Put black bowl on plate
libero_instruction: put the black bowl on the plate
bddl_file: KITCHEN_SCENE1_put_the_black_bowl_on_the_plate.bddl
high_pref_lan: Pick from right edge #left right is from the perspective of the robot
low_pref_lan: ''
subtask_offset:
  move_to:_all: [0.0, 0.0, 0.0]
damping_level: 0
naive_plan:
# plain center `pick` cannot lift the bowl (rim-only graspable), so the
# no-pref execution grasps the OPPOSITE (right) edge — visually distinct
# from the task_plan's left-edge pref and physically feasible.
- [pick_right_edge, akita_black_bowl_1]
- [put, plate_1]
task_plan:
- [pick_left_edge, akita_black_bowl_1]
- [put_left_edge, plate_1]
high_prefs:
- description: Pick from right edge
  action_parameters:
    pick_left_edge:
    - {}
    put_left_edge:
    - {}
low_prefs:
- type: grasp_offset
  params:
    axis: y
    frame: world
    signed: True
    target_obj: akita_black_bowl_1
    criterion_threshold: 0.000423
    criterion_direction: 1
  description: Pick from right edge
low_pref_calibration:
  grasp_offset:
    pref_anchor: 0.031875
    n_pref: 10
    naive_anchor: -0.03103
    n_naive: 10
