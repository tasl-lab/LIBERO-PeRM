mode:  data_gen        # dev | test | data_gen   (CLI --mode 可覆盖)
dev_batch_size: 2                # dev 模式下每个 mission 生成的 rollout 数 (用 dev_mission_ids)
test_batch_size: 5               # test 模式下每个 mission 生成的 rollout 数 (用 test_mission_ids)
data_gen_batch_size: 100         # PrefCompose — 12 missions × 100 = 1200 demos
data_gen_max_attempts: 140       # 100 demos 留 ~40% 余量
overwrite_old: 1                # 1=覆盖已有 HDF5 数据, 0=跳过已存在的
use_forcibly: 1                 # 1=强制生成最终合集hdf5（忽略不完整状态）, 0=遇到异常状态(e.g. low SR)跳过
parallel_execution: True        # True=Python 并行直接跑, False=生成 .sh 脚本
workers: 6 #最大并发 mission 数 (训练并跑时 6 紧但 OK, 8+ OOM), 16 worker 独占 ~55GB
tasksuite: SinglePref           # paper_figures temporary — series 1/2/3 missions
save_eval_hdf5: False           # True=每个成功 rollout 额外复制一份到 <mission>/Eval/ 给 VLM evaluation 用 (磁盘占用翻倍)
save_gif: False                 # True=生成每个 rollout 的 GIF 到 <mission>/GIFs/
