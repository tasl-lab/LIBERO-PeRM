# Experiment V — pi05_libero (LIBERO-tuned official ckpt) + SingPref v5 LoRA, step 44999.
#
# Pair to U: same data + recipe; only base ckpt differs (pi05_libero vs pi05_base).
# Tests whether retaining LIBERO base-task knowledge helps / hurts SingPref pref learning.
#
# Train data : perm/SingPref (40 missions, anchor prompt `Task: ... Preference: ...`)
# Train cfg  : pi05_libero_singpref_lora_v1   (registered in VLAs/openpi/src/openpi/training/config.py)
# Train run  : pi05_libero_singpref_run1
# Train script: VLA_train/openpi/runme_finetune_V.sh
#
# Suite: single-pref × {pref} × 4 trials = 160 episodes (40 missions after 2-4_112/2-5_112 dropped).
#
# Launch:
#   server: bash VLA_infer/server_pi05.sh VLA_infer/run_profile/InDomain/V_pi05_libero_singpref_step45k.yaml
#   client: bash VLA_infer/run_client.sh  VLA_infer/run_profile/InDomain/V_pi05_libero_singpref_step45k.yaml
# Aggregate:
#   python LIBERO/scripts/aggregate_eval.py /data3/zhixu/LIBERO-PeRM/Policy_output/lora_ft/single-pref/V_pi05_libero_singpref_step45k/pi05_libero_singpref_run1_step44999 --suite single-pref

experiment_name: V_pi05_libero_singpref_step45k
exp_type: lora_ft
task_suite: single-pref

prompt_source_yaml: /data3/zhixu/LIBERO-PeRM/VLA_data/SinglePref/tasksuite_v0.yaml

conditions: [base, pref]
num_trials: 4
replan_steps: 5
max_steps: 1250          # 1180 (U max successful) + 70 buffer
seed: 7

save_hdf5: false
save_video: true
save_gif: false

server:
  vla: pi05
  name: pi05_libero_singpref_run1_step44999
  host: 0.0.0.0
  port: 8013
  config: pi05_libero_singpref_lora_v1
  checkpoint: /data3/zhixu/LIBERO-PeRM/VLAs/openpi/checkpoints/pi05_libero_singpref_lora_v1/pi05_libero_singpref_run1/44999
  cuda_devices: "4,5,6,7"
  default_prompt: null
