server:
  vla: pi0
  name: pi0_singpref_run1_step44999
  host: 0.0.0.0
  port: 8015
  config: pi0_singpref_lora_v1
  checkpoint: /data3/zhixu/LIBERO-PeRM/VLAs/openpi/checkpoints/pi0_singpref_lora_v1/pi0_singpref_run1/44999
