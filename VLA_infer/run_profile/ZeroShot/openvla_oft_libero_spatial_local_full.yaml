# Full single-pref sweep with the local OpenVLA-OFT LIBERO spatial checkpoint.

experiment_name: openvla_oft_libero_spatial_local_full
exp_type: 0shot
task_suite: single-pref

# missions omitted -> eval.py loads the full single-pref suite

conditions: [base, pref]
num_trials: 1
replan_steps: 5
max_steps: null
seed: 7

server:
  vla: openvla_oft
  name: openvla_oft_libero_spatial_local
  host: 0.0.0.0
  port: 8002

  config: libero_spatial
  checkpoint: /data3/zhixu/LIBERO-PeRM/checkpoints/openvla_oft/libero_spatial
  cuda_devices: "7"
  default_prompt: null

  use_l1_regression: true
  use_diffusion: false
  use_film: false
  use_proprio: true
  num_images_in_input: 2
  proprio_dim: 8
  unnorm_key: libero_spatial_no_noops

  load_in_8bit: false
  load_in_4bit: false
  image_size: 224
  action_dim: 7
