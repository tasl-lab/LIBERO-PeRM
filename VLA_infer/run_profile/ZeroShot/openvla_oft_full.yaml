# Full-suite base-model runfile for OpenVLA 7B on P-Bench single-pref.
#
# This is still a base-model evaluation, so treat it as a broad wiring /
# baseline sweep rather than a strong task-performance benchmark.

experiment_name: openvla_oft_singlepref_full
exp_type: 0shot
task_suite: single-pref

# `missions` omitted on purpose -> eval.py will load the full suite.

conditions: [base]
num_trials: 1
replan_steps: 5
max_steps: null
seed: 7

server:
  vla: openvla_oft
  name: openvla_7b_base_full
  host: 0.0.0.0
  port: 8002

  config: openvla_7b_base
  checkpoint: /data3/zhixu/LIBERO-PeRM/checkpoints/openvla/openvla-7b
  cuda_devices: "0"
  default_prompt: null

  # Conservative base-model settings.
  use_l1_regression: false
  use_diffusion: false
  use_film: false
  use_proprio: false
  num_images_in_input: 1
  unnorm_key: bridge_orig

  load_in_8bit: false
  load_in_4bit: false
  image_size: 224
  action_dim: 7
