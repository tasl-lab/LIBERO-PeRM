# LIBERO-PrefScale: the 100 tasks counted in the 312-task benchmark (LIBERO/dataset/SUITE_PLAN_312.md, section 5.2).
# tasksuite.yaml next to this file is the 35-mission training registry behind Fig. 4 of the paper; it is left as is.
#
# A task is one layout + one task instruction + one preference prompt. Five slots keep task and preference fixed
# and vary the layout; 12 no-preference twins share a layout with a preference mission; the 12 pref-ood tasks put
# the four preferences on three layouts of the no-preference task (unseen layout, different task).
#
# Not counted: 2-5_116_10 (salad dressing) and 2-5_116_11 (book). Their left-side grasp falls back to the
# right-side parameters or to a default that does not transfer; see the DEBUG_NOTES.md in those directories.

suite: prefscale

slots:
  nopref:    {family: "0-1", preference: ""}
  speed:     {family: "1-1", preference: "Speed up"}
  left_side: {family: "2-5", preference: "Pick from left side"}
  red:       {family: "3-2", preference: "Prefer red objects"}
  multi:     {family: "4-3", preference: "Pick from left side. Speed up"}

