# LIBERO-Scale unified tasksuite
# Used by convert_perm_hdf5_to_lerobot_singpref_anchor.py
#
# K=1 baseline = all 5 train_eval missions (one per tier) jointly
#   total demos = sum of n_demos for train_eval missions
# K=3, K=7 = same structure but each tier extends with extra layouts (TODO)
#
# Roles:
#   train_eval — used for both training and in-domain eval
#   eval_only  — held-out, used for layout-OOD eval only (no demos generated)

